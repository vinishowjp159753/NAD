<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ESPEP - Sistema de Mapas</title>

<style>
body{font-family:'Segoe UI';background:#eef2f7;margin:0;}

header{
background:linear-gradient(90deg,#0d3b66,#1d6fa5);
color:#fff;padding:20px;text-align:center;
}

.container{max-width:1200px;margin:auto;padding:20px;}

.card{
background:#fff;padding:15px;border-radius:10px;margin-bottom:15px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

button{
background:#0d3b66;color:#fff;border:none;padding:6px 10px;
border-radius:6px;cursor:pointer;margin:2px;
}

.btn-danger{background:#c0392b;}
.btn-edit{background:#f39c12;}

table{width:100%;border-collapse:collapse;}

th{
background:#0d3b66;color:#fff;font-size:13px;
}

td{
font-size:12px;padding:6px;border:1px solid #ddd;
}

tr:nth-child(even){background:#f8fafc;}

.menor{
background:#d1fae5 !important;
font-weight:bold;
border-left:4px solid #10b981;
}

.topo-oficial{
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:3px solid #0d3b66;
margin-bottom:15px;
padding-bottom:10px;
}

.logos{
display:flex;
gap:20px;
align-items:center;
}

.logos img{height:70px;}

.assinatura{
text-align:center;
margin-top:50px;
}

.linha{
border-top:1px solid #000;
width:300px;
margin:40px auto 10px;
}

.hidden{display:none;}

@media print{
.no-print{display:none !important;}
*{-webkit-print-color-adjust:exact;}
body{background:#fff;}
}
</style>
</head>

<body>

<header>📊 Sistema de Mapa Comparativo - ESPEP</header>

<div class="container">

<!-- PROCESSOS -->
<div id="telaProcessos">

<div class="card">
<input id="numero" placeholder="Número">
<input id="orgao" placeholder="Órgão">
<input id="data" type="date">
<button onclick="criarProcesso()">Criar</button>
</div>

<div class="card">
<ul id="listaProcessos"></ul>
</div>

</div>

<!-- MAPA -->
<div id="telaMapa" class="hidden">

<button class="no-print" onclick="voltar()">⬅ Voltar</button>

<div id="areaPDF">

<div class="topo-oficial">
<div class="logos">
<img src="img/GovPBT.png" onerror="this.style.display='none'">
<img src="img/LOGOESPEP.PNG" onerror="this.style.display='none'">
</div>
<div>
<strong>GOVERNO DA PARAÍBA</strong><br>
ESCOLA DE SERVIÇO PÚBLICO - ESPEP<br>
MAPA COMPARATIVO DE PREÇOS
</div>
</div>

<h3 id="tituloProcesso"></h3>

<table>
<thead>
<tr>
<th>Item</th>
<th>Código</th>
<th>Descrição</th>
<th>Qtd</th>
<th>Empresa</th>
<th>CNPJ</th>
<th>Total</th>
<th>Origem</th>
<th>Média</th>
<th>Mediana</th>
<th>Desvio</th>
<th>Mín</th>
<th>Máx</th>
<th class="no-print">Ações</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<div class="assinatura">
<div class="linha"></div>
<p id="assinaturaTexto"></p>
</div>

</div>

<!-- FORM -->
<div class="card no-print">
<input id="codigoItem" placeholder="Código">
<input id="descItem" placeholder="Descrição">
<input id="qtdItem" type="number" placeholder="Qtd">
<input id="undItem" placeholder="Unidade">
<button onclick="addItem()">Adicionar Item</button>
</div>

<div class="card no-print">
<select id="itemSelect"></select>
<input id="empresa" placeholder="Empresa">
<input id="cnpj" placeholder="CNPJ">
<input id="valor" type="number" placeholder="Valor">
<input id="origem" placeholder="Origem da proposta">
<button onclick="addCotacao()">Adicionar</button>
</div>

<div class="card no-print">
<input id="nomeResp" placeholder="Nome">
<input id="matriculaResp" placeholder="Matrícula">
<input id="setorResp" placeholder="Setor">
<button onclick="gerarAssinatura()">Salvar Assinatura</button>
</div>

<button class="no-print" onclick="window.print()">📄 Gerar PDF</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, where
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
apiKey:"AIzaSyDO4A2KN_AUmGgkKuIP_A9ynOEIGinZph0",
authDomain:"nad1-3fbbf.firebaseapp.com",
projectId:"nad1-3fbbf"
});

const db = getFirestore(app);

let processoAtual=null;
let itens=[];

// PROCESSOS
window.criarProcesso=async()=>{
await addDoc(collection(db,"processos"),{
numero:numero.value,
orgao:orgao.value,
data:data.value
});
carregarProcessos();
}

async function carregarProcessos(){
listaProcessos.innerHTML="";
let snap=await getDocs(collection(db,"processos"));
snap.forEach(d=>{
let p=d.data();
listaProcessos.innerHTML+=`
<li>${p.numero}
<button onclick="abrir('${d.id}','${p.numero}')">Abrir</button>
<button class="btn-danger" onclick="excluirProcesso('${d.id}')">Excluir</button>
</li>`;
});
}

window.excluirProcesso=async(id)=>{
if(!confirm("Excluir processo?"))return;
await deleteDoc(doc(db,"processos",id));
carregarProcessos();
}

window.abrir=(id,num)=>{
processoAtual=id;
tituloProcesso.innerText=num;
telaProcessos.classList.add("hidden");
telaMapa.classList.remove("hidden");
carregarItens();
}

// ITEM
window.addItem=async()=>{
await addDoc(collection(db,"itens"),{
processo:processoAtual,
codigo:codigoItem.value,
descricao:descItem.value,
qtd:parseFloat(qtdItem.value),
und:undItem.value
});
carregarItens();
}

window.editarItem=async(id,desc)=>{
let novo=prompt("Editar descrição:",desc);
if(!novo)return;
await updateDoc(doc(db,"itens",id),{descricao:novo});
carregarItens();
}

window.excluirItem=async(id)=>{
if(!confirm("Excluir item completo?"))return;

let cot=await getDocs(query(collection(db,"cotacoes"),where("item","==",id)));
cot.forEach(async c=>await deleteDoc(doc(db,"cotacoes",c.id)));

await deleteDoc(doc(db,"itens",id));
carregarItens();
}

// COTAÇÃO
window.addCotacao=async()=>{
await addDoc(collection(db,"cotacoes"),{
processo:processoAtual,
item:itemSelect.value,
empresa:empresa.value,
cnpj:cnpj.value,
valor:parseFloat(valor.value),
origem:origem.value
});
carregarItens();
}

window.editarCotacao=async(id,empresa)=>{
let novo=prompt("Editar empresa:",empresa);
if(!novo)return;
await updateDoc(doc(db,"cotacoes",id),{empresa:novo});
carregarItens();
}

window.excluirCotacao=async(id)=>{
if(!confirm("Excluir empresa?"))return;
await deleteDoc(doc(db,"cotacoes",id));
carregarItens();
}

// RENDER
function render(){
tbody.innerHTML="";

itens.forEach((item,i)=>{
if(!item.cotacoes.length)return;

let totais=item.cotacoes.map(c=>c.valor*item.qtd);
let menor=Math.min(...totais);

item.cotacoes.forEach((c,j)=>{
let total=c.valor*item.qtd;

tbody.innerHTML+=`
<tr class="${total===menor?'menor':''}">
<td>${i+1}</td>
<td>${item.codigo||'-'}</td>
<td>${item.descricao}</td>
<td>${item.qtd}</td>
<td>${c.empresa}</td>
<td>${c.cnpj}</td>
<td>${total.toFixed(2)}</td>
<td>${c.origem}</td>

<td class="no-print">
<button class="btn-edit" onclick="editarCotacao('${c.id}','${c.empresa}')">✏️</button>
<button class="btn-danger" onclick="excluirCotacao('${c.id}')">X</button>
</td>
</tr>`;
});
});
}

window.voltar=()=>{
telaMapa.classList.add("hidden");
telaProcessos.classList.remove("hidden");
}

</script>

</body>
</html>
