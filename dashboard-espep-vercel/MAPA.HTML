<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ESPEP - Sistema MASTER</title>

<!-- PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<style>
body{font-family:'Segoe UI';background:#eef2f7;margin:0;}
header{background:#0d3b66;color:#fff;padding:15px;text-align:center;}
.container{max-width:1200px;margin:auto;padding:20px;}
.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:10px;}
button{background:#0d3b66;color:#fff;border:none;padding:6px 10px;border-radius:6px;margin:2px;}
.btn-danger{background:#c0392b;}
.btn-edit{background:#f39c12;}
table{width:100%;border-collapse:collapse;}
th{background:#0d3b66;color:#fff;}
td{border:1px solid #ddd;padding:5px;}
.menor{background:#d1fae5;}
.hidden{display:none;}
</style>
</head>

<body>

<header>📊 Sistema ESPEP MASTER</header>

<div class="container">

<div id="telaProcessos">
<div class="card">
<input id="numero" placeholder="Número">
<input id="orgao" placeholder="Órgão">
<input id="data" type="date">
<button onclick="criarProcesso()">Criar</button>
</div>
<ul id="listaProcessos"></ul>
</div>

<div id="telaMapa" class="hidden">

<button onclick="voltar()">⬅ Voltar</button>
<h3 id="tituloProcesso"></h3>

<table>
<thead>
<tr>
<th>Item</th><th>Código</th><th>Descrição</th><th>Qtd</th>
<th>Empresa</th><th>CNPJ</th><th>Total</th><th>Origem</th>
<th>Média</th><th>Mediana</th><th>Desvio</th><th>Mín</th><th>Máx</th>
<th>Ações</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<div class="card">
<input id="codigoItem" placeholder="Código">
<input id="descItem" placeholder="Descrição">
<input id="qtdItem" type="number" placeholder="Qtd">
<input id="undItem" placeholder="Unidade">
<button onclick="addItem()">Adicionar Item</button>
</div>

<div class="card">
<select id="itemSelect"></select>
<input id="empresa" placeholder="Empresa">
<input id="cnpj" placeholder="CNPJ">
<input id="valor" type="number" placeholder="Valor">
<input id="origem" placeholder="Origem">
<button onclick="addCotacao()">Adicionar</button>
</div>

<div class="card">
<h4>Assinatura</h4>
<input id="nomeResp" placeholder="Nome">
<input id="matriculaResp" placeholder="Matrícula">
<input id="setorResp" placeholder="Setor">
<button onclick="salvarAssinatura()">Salvar Assinatura</button>
</div>

<div class="card">
<h4>Fornecedor Vencedor Geral</h4>
<select id="vencedorSelect"></select>
</div>

<button onclick="gerarPDF()">📄 Gerar PDF TCE</button>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, where
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
apiKey:"AIzaSyDO4A2KN_AUmGgkKuIP_A9ynOEIGinZph0",
authDomain:"nad1-3fbbf.firebaseapp.com",
projectId:"nad1-3fbbf"
});

const db = getFirestore(app);

let processoAtual=null;
let itens=[];
let assinatura={};

// PROCESSOS
window.criarProcesso=async()=>{
await addDoc(collection(db,"processos"),{
numero:numero.value,orgao:orgao.value,data:data.value});
carregarProcessos();
}

window.carregarProcessos=async()=>{
listaProcessos.innerHTML="";
let snap=await getDocs(collection(db,"processos"));
snap.forEach(d=>{
let p=d.data();
listaProcessos.innerHTML+=`<li>${p.numero}
<button onclick="abrir('${d.id}','${p.numero}')">Abrir</button></li>`;
});
}

window.abrir=async(id,num)=>{
processoAtual=id;
tituloProcesso.innerText=num;
telaProcessos.classList.add("hidden");
telaMapa.classList.remove("hidden");
carregarItens();
}

// ITEM
window.addItem=async()=>{
await addDoc(collection(db,"itens"),{
processo:processoAtual,
codigo:codigoItem.value,
descricao:descItem.value,
qtd:parseFloat(qtdItem.value),
und:undItem.value});
carregarItens();
}

window.editarItem=async(id,desc)=>{
let novo=prompt("Editar:",desc);
if(!novo)return;
await updateDoc(doc(db,"itens",id),{descricao:novo});
carregarItens();
}

window.excluirItem=async(id)=>{
if(!confirm("Excluir item?"))return;
let cot=await getDocs(query(collection(db,"cotacoes"),where("item","==",id)));
cot.forEach(async c=>await deleteDoc(doc(db,"cotacoes",c.id)));
await deleteDoc(doc(db,"itens",id));
carregarItens();
}

// COTAÇÃO
window.addCotacao=async()=>{
await addDoc(collection(db,"cotacoes"),{
processo:processoAtual,
item:itemSelect.value,
empresa:empresa.value,
cnpj:cnpj.value,
valor:parseFloat(valor.value),
origem:origem.value});
carregarItens();
}

window.editarCotacao=async(id,empresa)=>{
let novo=prompt("Editar empresa:",empresa);
if(!novo)return;
await updateDoc(doc(db,"cotacoes",id),{empresa:novo});
carregarItens();
}

window.excluirCotacao=async(id)=>{
if(!confirm("Excluir empresa?"))return;
await deleteDoc(doc(db,"cotacoes",id));
carregarItens();
}

// STATS
function stats(v){
let m=v.reduce((a,b)=>a+b,0)/v.length;
let o=[...v].sort((a,b)=>a-b);
return{
media:m,mediana:o[Math.floor(v.length/2)],
desvio:Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/v.length),
min:o[0],max:o[o.length-1]};
}

// CARREGAR
window.carregarItens=async()=>{
itens=[];

let snap=await getDocs(query(collection(db,"itens"),where("processo","==",processoAtual)));
snap.forEach(d=>itens.push({id:d.id,...d.data(),cotacoes:[]}));

let cot=await getDocs(query(collection(db,"cotacoes"),where("processo","==",processoAtual)));
cot.forEach(d=>{
let c={id:d.id,...d.data()};
let item=itens.find(i=>i.id===c.item);
if(item)item.cotacoes.push(c);
});

// fornecedor vencedor select
let fornecedores=[];
itens.forEach(item=>{
item.cotacoes.forEach(c=>{
if(!fornecedores.includes(c.empresa)){
fornecedores.push(c.empresa);
}
});
});

vencedorSelect.innerHTML="<option value=''>Selecione</option>";
fornecedores.forEach(f=>{
vencedorSelect.innerHTML+=`<option value="${f}">${f}</option>`;
});

// select itens
itemSelect.innerHTML="";
itens.forEach(i=>{
itemSelect.innerHTML+=`<option value="${i.id}">${i.descricao}</option>`;
});

render();
}

// RENDER
window.render=()=>{
tbody.innerHTML="";

itens.forEach((item,i)=>{
if(!item.cotacoes.length)return;

let totais=item.cotacoes.map(c=>c.valor*item.qtd);
let s=stats(totais);
let menor=Math.min(...totais);

item.cotacoes.forEach((c,j)=>{
let total=c.valor*item.qtd;

tbody.innerHTML+=`
<tr class="${total===menor?'menor':''}">
<td>${i+1}</td>
<td>${item.codigo||'-'}</td>
<td>${item.descricao}</td>
<td>${item.qtd}</td>
<td>${c.empresa}</td>
<td>${c.cnpj}</td>
<td>${total.toFixed(2)}</td>
<td>${c.origem}</td>

${j===0?`
<td rowspan="${item.cotacoes.length}">${s.media.toFixed(2)}</td>
<td rowspan="${item.cotacoes.length}">${s.mediana.toFixed(2)}</td>
<td rowspan="${item.cotacoes.length}">${s.desvio.toFixed(2)}</td>
<td rowspan="${item.cotacoes.length}">${s.min.toFixed(2)}</td>
<td rowspan="${item.cotacoes.length}">${s.max.toFixed(2)}</td>`:""}

<td>
<button class="btn-edit" onclick="editarCotacao('${c.id}','${c.empresa}')">✏️</button>
<button class="btn-danger" onclick="excluirCotacao('${c.id}')">X</button>
${j===0?`
<button onclick="editarItem('${item.id}','${item.descricao}')">Item</button>
<button onclick="excluirItem('${item.id}')">Excluir</button>`:""}
</td>
</tr>`;
});
});
}

// ASSINATURA
window.salvarAssinatura=()=>{
assinatura={
nome:nomeResp.value,
matricula:matriculaResp.value,
setor:setorResp.value
};
alert("Assinatura salva!");
}

// PDF
window.gerarPDF=()=>{
const { jsPDF } = window.jspdf;
const doc = new jsPDF("l","mm","a4");

let y=10;

// logos
try{
doc.addImage("img/GovPBT.png","PNG",10,y,25,18);
doc.addImage("img/LOGOESPEP.png","PNG",40,y,25,18);
}catch(e){}

doc.text("MAPA COMPARATIVO DE PREÇOS - ESPEP",100,y+10);

y+=25;

let body=[];

itens.forEach((item,i)=>{
let totais=item.cotacoes.map(c=>c.valor*item.qtd);
let s=stats(totais);

let ranking=item.cotacoes.map(c=>({...c,total:c.valor*item.qtd}))
.sort((a,b)=>a.total-b.total);

ranking.forEach((c,index)=>{
body.push([
i+1,item.codigo,item.descricao,item.qtd,
c.empresa,c.cnpj,c.total.toFixed(2),c.origem,index+1,
s.media.toFixed(2),s.mediana.toFixed(2),
s.desvio.toFixed(2),s.min.toFixed(2),s.max.toFixed(2)
]);
});
});

doc.autoTable({
startY:y,
head:[["Item","Código","Descrição","Qtd","Empresa","CNPJ","Total","Origem","Ranking","Média","Mediana","Desvio","Mín","Máx"]],
body:body,
styles:{fontSize:7},
headStyles:{fillColor:[13,59,102]}
});

// JUSTIFICATIVA COM VENCEDOR
let finalY=doc.lastAutoTable.finalY+10;

let vencedor=vencedorSelect.value || "o fornecedor melhor classificado";

doc.text("JUSTIFICATIVA:",10,finalY);

doc.setFontSize(9);
doc.text(
doc.splitTextToSize(
`Após análise das propostas apresentadas, verifica-se que a empresa ${vencedor} apresentou o menor preço global, sendo considerada a proposta mais vantajosa para a Administração Pública, em conformidade com os princípios da economicidade e eficiência.`,
260
),
10,
finalY+5
);

// assinatura
finalY+=30;

doc.text("__________________________________",100,finalY);

doc.text(
`${assinatura.nome||""}
Matrícula: ${assinatura.matricula||""}
Setor: ${assinatura.setor||""}
Data: ${new Date().toLocaleDateString("pt-BR")}`,
100,
finalY+5
);

doc.save("Mapa_TCE_MASTER.pdf");
}

window.voltar=()=>{
telaMapa.classList.add("hidden");
telaProcessos.classList.remove("hidden");
}

carregarProcessos();

</script>

</body>
</html>
