<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ESPEP - Sistema de Mapas</title>

<style>
body{font-family:'Segoe UI';background:#f1f5f9;margin:0;}

header{
background:linear-gradient(90deg,#0d3b66,#1d6fa5);
color:#fff;padding:20px;text-align:center;
}

.container{max-width:1200px;margin:auto;padding:20px;}

.card{
background:#fff;padding:15px;border-radius:10px;margin-bottom:15px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

button{
background:#0d3b66;color:#fff;border:none;padding:6px 10px;
border-radius:6px;cursor:pointer;margin:2px;
}

.btn-danger{background:#c0392b;}

table{width:100%;border-collapse:collapse;}

th{background:#0d3b66;color:#fff;font-size:13px;}
td{font-size:12px;padding:6px;border:1px solid #ddd;}

.menor{background:#d1fae5 !important;font-weight:bold;}

.hidden{display:none;}

.topo-oficial{
display:flex;align-items:center;gap:15px;
border-bottom:3px solid #0d3b66;margin-bottom:10px;
}

.topo-oficial img{width:80px;}

@media print{
.no-print{display:none;}
*{-webkit-print-color-adjust:exact;}
}
</style>
</head>

<body>

<header>📊 Sistema de Mapa Comparativo - ESPEP</header>

<div class="container">

<!-- PROCESSOS -->
<div id="telaProcessos">

<div class="card">
<h3>Novo Processo</h3>
<input id="numero" placeholder="Número">
<input id="orgao" placeholder="Órgão">
<input id="data" type="date">
<button onclick="criarProcesso()">Criar</button>
</div>

<div class="card">
<h3>Histórico</h3>
<ul id="listaProcessos"></ul>
</div>

</div>

<!-- MAPA -->
<div id="telaMapa" class="hidden">

<button class="no-print" onclick="voltar()">⬅ Voltar</button>

<div id="areaPDF">

<div class="topo-oficial">
<img src="img/GovPBT.png" onerror="this.style.display='none'">
<div>
<strong>GOVERNO DA PARAÍBA</strong><br>
MAPA COMPARATIVO DE PREÇOS
</div>
</div>

<h3 id="tituloProcesso"></h3>

<table>
<thead>
<tr>
<th>Item</th>
<th>Código</th>
<th>Descrição</th>
<th>Qtd</th>
<th>Empresa</th>
<th>CNPJ</th>
<th>Total</th>
<th>Proposta</th>
<th>Média</th>
<th>Mediana</th>
<th>Desvio</th>
<th>Mín</th>
<th>Máx</th>
<th class="no-print">Ações</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</div>

<!-- FORM -->
<div class="card no-print">
<input id="codigoItem" placeholder="Código Central">
<input id="descItem" placeholder="Descrição">
<input id="qtdItem" type="number" placeholder="Qtd">
<input id="undItem" placeholder="Unidade">
<button onclick="addItem()">Adicionar Item</button>
</div>

<div class="card no-print">
<select id="itemSelect"></select>
<input id="empresa" placeholder="Empresa">
<input id="cnpj" placeholder="CNPJ">
<input id="valor" type="number" placeholder="Valor">
<input id="link" placeholder="Link proposta">
<button onclick="addCotacao()">Adicionar</button>
</div>

<button class="no-print" onclick="gerarPDF()">📄 Gerar PDF</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, where
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
apiKey:"AIzaSyDO4A2KN_AUmGgkKuIP_A9ynOEIGinZph0",
authDomain:"nad1-3fbbf.firebaseapp.com",
projectId:"nad1-3fbbf"
});

const db = getFirestore(app);

let processoAtual=null;
let itens=[];

// PROCESSOS
window.criarProcesso=async()=>{
await addDoc(collection(db,"processos"),{
numero:numero.value,
orgao:orgao.value,
data:data.value
});
carregarProcessos();
}

async function carregarProcessos(){
listaProcessos.innerHTML="";
let snap=await getDocs(collection(db,"processos"));

snap.forEach(docSnap=>{
let p=docSnap.data();
listaProcessos.innerHTML+=`
<li>
${p.numero} - ${p.orgao}
<button onclick="abrir('${docSnap.id}','${p.numero}')">Abrir</button>
<button class="btn-danger" onclick="excluirProcesso('${docSnap.id}')">Excluir</button>
</li>`;
});
}

// EXCLUIR PROCESSO
window.excluirProcesso=async(id)=>{
if(!confirm("Excluir processo completo?")) return;
await deleteDoc(doc(db,"processos",id));
carregarProcessos();
}

window.abrir=async(id,num)=>{
processoAtual=id;
tituloProcesso.innerText="Processo: "+num;
telaProcessos.classList.add("hidden");
telaMapa.classList.remove("hidden");
carregarItens();
}

// ITENS
window.addItem=async()=>{
await addDoc(collection(db,"itens"),{
processo:processoAtual,
codigo:codigoItem.value,
descricao:descItem.value,
qtd:parseFloat(qtdItem.value),
und:undItem.value
});
carregarItens();
}

// EXCLUIR ITEM
window.excluirItem=async(id)=>{
if(!confirm("Excluir item?")) return;
await deleteDoc(doc(db,"itens",id));
carregarItens();
}

// COTAÇÕES
window.addCotacao=async()=>{
await addDoc(collection(db,"cotacoes"),{
processo:processoAtual,
item:itemSelect.value,
empresa:empresa.value,
cnpj:cnpj.value,
valor:parseFloat(valor.value),
link:link.value
});
carregarItens();
}

async function carregarItens(){

itens=[];

let snap=await getDocs(query(collection(db,"itens"),where("processo","==",processoAtual)));
snap.forEach(docSnap=>{
itens.push({id:docSnap.id,...docSnap.data(),cotacoes:[]});
});

let cot=await getDocs(query(collection(db,"cotacoes"),where("processo","==",processoAtual)));
cot.forEach(docSnap=>{
let c=docSnap.data();
let item=itens.find(i=>i.id===c.item);
if(item)item.cotacoes.push(c);
});

itemSelect.innerHTML="";
itens.forEach(i=>{
itemSelect.innerHTML+=`<option value="${i.id}">${i.descricao}</option>`;
});

render();
}

// STATS
function stats(v){
let m=v.reduce((a,b)=>a+b,0)/v.length;
let o=[...v].sort((a,b)=>a-b);
let varr=v.reduce((a,b)=>a+(b-m)**2,0)/v.length;
return{media:m,mediana:o[Math.floor(v.length/2)],desvio:Math.sqrt(varr),min:o[0],max:o[o.length-1]};
}

// RENDER
function render(){
tbody.innerHTML="";

itens.forEach((item,i)=>{
if(!item.cotacoes.length)return;

let totais=item.cotacoes.map(c=>c.valor*item.qtd);
let s=stats(totais);
let menor=Math.min(...totais);

item.cotacoes.forEach((c,j)=>{
let total=c.valor*item.qtd;

tbody.innerHTML+=`
<tr class="${total===menor?'menor':''}">
<td>${i+1}</td>
<td>${item.codigo || '-'}</td>
<td>${item.descricao}</td>
<td>${item.qtd} ${item.und}</td>
<td>${c.empresa}</td>
<td>${c.cnpj}</td>
<td>R$ ${total.toFixed(2)}</td>
<td><a href="${c.link}" target="_blank">Abrir</a></td>

${j===0?`
<td rowspan="${item.cotacoes.length}">${s.media.toFixed(2)}</td>
<td rowspan="${item.cotacoes.length}">${s.mediana.toFixed(2)}</td>
<td rowspan="${item.cotacoes.length}">${s.desvio.toFixed(2)}</td>
<td rowspan="${item.cotacoes.length}">${s.min.toFixed(2)}</td>
<td rowspan="${item.cotacoes.length}">${s.max.toFixed(2)}</td>
`:""}

<td class="no-print">
<button class="btn-danger" onclick="excluirItem('${item.id}')">X</button>
</td>

</tr>`;
});
});
}

// PDF
window.gerarPDF=()=>{
window.print();
}

window.voltar=()=>{
telaMapa.classList.add("hidden");
telaProcessos.classList.remove("hidden");
}

carregarProcessos();

</script>

</body>
</html>
