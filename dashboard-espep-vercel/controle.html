<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle Financeiro Profissional</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0f172a;
    color:white;
    padding:20px;
}

h1{
    margin-bottom:20px;
    font-size:32px;
}

.container{
    display:grid;
    grid-template-columns:350px 1fr;
    gap:20px;
}

.card{
    background:#1e293b;
    border-radius:20px;
    padding:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.3);
}

input, select, button{
    width:100%;
    padding:12px;
    margin-top:12px;
    border:none;
    border-radius:12px;
    background:#334155;
    color:white;
}

button{
    background:#2563eb;
    cursor:pointer;
    font-weight:bold;
    transition:0.2s;
}

button:hover{
    transform:scale(1.02);
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:20px;
}

.kpi{
    background:#1e293b;
    padding:20px;
    border-radius:20px;
}

.kpi h3{
    opacity:0.7;
    margin-bottom:10px;
}

.kpi p{
    font-size:28px;
    font-weight:bold;
}

.green{
    color:#22c55e;
}

.red{
    color:#ef4444;
}

.blue{
    color:#3b82f6;
}

.orange{
    color:#f59e0b;
}

.charts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.table-container{
    margin-top:20px;
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

table th,
table td{
    padding:14px;
    border-bottom:1px solid #334155;
}

.card-cartao{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    border-radius:20px;
    padding:20px;
    margin-top:15px;
}

.progress{
    width:100%;
    height:12px;
    background:rgba(255,255,255,0.2);
    border-radius:20px;
    overflow:hidden;
    margin-top:10px;
}

.progress-bar{
    height:100%;
    background:#22c55e;
}

.meses{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:20px;
}

.mes-card{
    background:#334155;
    padding:15px;
    border-radius:15px;
}

@media(max-width:1200px){

    .dashboard{
        grid-template-columns:1fr;
    }

    .container{
        grid-template-columns:1fr;
    }

    .charts{
        grid-template-columns:1fr;
    }

    .meses{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<h1>💰 Controle Financeiro Profissional</h1>

<div class="dashboard">

    <div class="kpi">
        <h3>Receitas</h3>
        <p class="green" id="receitasTotal">R$ 0</p>
    </div>

    <div class="kpi">
        <h3>Despesas</h3>
        <p class="red" id="despesasTotal">R$ 0</p>
    </div>

    <div class="kpi">
        <h3>Saldo</h3>
        <p class="blue" id="saldoTotal">R$ 0</p>
    </div>

    <div class="kpi">
        <h3>Cartão</h3>
        <p class="orange" id="cartaoTotal">R$ 0</p>
    </div>

</div>

<div class="container">

    <div class="card">

        <h2>Novo Lançamento</h2>

        <input type="text" id="descricao" placeholder="Descrição">

        <input type="number" id="valor" placeholder="Valor">

        <select id="natureza">
            <option value="receita">Receita</option>
            <option value="despesa">Despesa</option>
        </select>

        <select id="tipo">
            <option value="avista">À Vista</option>
            <option value="parcelado">Cartão Parcelado</option>
            <option value="recorrente">Recorrente</option>
        </select>

        <input type="text" id="cartao" placeholder="Nome do Cartão">

        <input type="number" id="limite" placeholder="Limite do Cartão">

        <input type="number" id="parcelas" placeholder="Quantidade Parcelas">

        <input type="number" id="recorrencia" placeholder="Qtd Meses Recorrência">

        <button onclick="adicionarLancamento()">
            Adicionar
        </button>

        <div id="cartoes"></div>

    </div>

    <div>

        <div class="charts">

            <div class="card">
                <h2>Fluxo Mensal</h2>
                <canvas id="graficoMeses"></canvas>
            </div>

            <div class="card">
                <h2>Distribuição</h2>
                <canvas id="graficoTipos"></canvas>
            </div>

        </div>

        <div class="card" style="margin-top:20px;">

            <h2>Resumo dos Meses</h2>

            <div class="meses" id="meses"></div>

        </div>

    </div>

</div>

<div class="card table-container">

    <h2>Lançamentos</h2>

    <table>

        <thead>
            <tr>
                <th>Descrição</th>
                <th>Valor</th>
                <th>Natureza</th>
                <th>Tipo</th>
                <th>Mês</th>
            </tr>
        </thead>

        <tbody id="tabela"></tbody>

    </table>

</div>

<script>

let lancamentos =
    JSON.parse(localStorage.getItem("financeiro")) || [];

const nomesMeses = [
    "Janeiro","Fevereiro","Março","Abril",
    "Maio","Junho","Julho","Agosto",
    "Setembro","Outubro","Novembro","Dezembro"
];

function salvar(){
    localStorage.setItem(
        "financeiro",
        JSON.stringify(lancamentos)
    );
}

function adicionarLancamento(){

    const descricao =
        document.getElementById("descricao").value;

    const valor =
        parseFloat(document.getElementById("valor").value);

    const natureza =
        document.getElementById("natureza").value;

    const tipo =
        document.getElementById("tipo").value;

    const cartao =
        document.getElementById("cartao").value;

    const limite =
        parseFloat(document.getElementById("limite").value) || 0;

    const parcelas =
        parseInt(document.getElementById("parcelas").value) || 1;

    const recorrencia =
        parseInt(document.getElementById("recorrencia").value) || 1;

    if(!descricao || !valor){
        alert("Preencha os campos");
        return;
    }

    const hoje = new Date();

    if(tipo === "avista"){

        lancamentos.push({
            descricao,
            valor,
            natureza,
            tipo,
            cartao,
            limite,
            mes: hoje.getMonth()
        });

    }

    if(tipo === "parcelado"){

        const valorParcela = valor / parcelas;

        for(let i = 0; i < parcelas; i++){

            let mes =
                (hoje.getMonth() + i) % 12;

            lancamentos.push({
                descricao: `${descricao} (${i+1}/${parcelas})`,
                valor: valorParcela,
                natureza,
                tipo,
                cartao,
                limite,
                mes
            });

        }

    }

    if(tipo === "recorrente"){

        for(let i = 0; i < recorrencia; i++){

            let mes =
                (hoje.getMonth() + i) % 12;

            lancamentos.push({
                descricao,
                valor,
                natureza,
                tipo,
                cartao,
                limite,
                mes
            });

        }

    }

    salvar();

    renderizar();

    limpar();
}

function limpar(){

    document.getElementById("descricao").value = "";
    document.getElementById("valor").value = "";
    document.getElementById("cartao").value = "";
    document.getElementById("limite").value = "";
    document.getElementById("parcelas").value = "";
    document.getElementById("recorrencia").value = "";

}

function renderizar(){

    let tabela =
        document.getElementById("tabela");

    tabela.innerHTML = "";

    let receitas = 0;
    let despesas = 0;
    let cartao = 0;

    lancamentos.forEach(l => {

        if(l.natureza === "receita"){
            receitas += l.valor;
        }else{
            despesas += l.valor;
        }

        if(l.tipo === "parcelado"){
            cartao += l.valor;
        }

        tabela.innerHTML += `
            <tr>
                <td>${l.descricao}</td>
                <td>R$ ${l.valor.toFixed(2)}</td>
                <td>${l.natureza}</td>
                <td>${l.tipo}</td>
                <td>${nomesMeses[l.mes]}</td>
            </tr>
        `;

    });

    document.getElementById("receitasTotal")
        .innerText = `R$ ${receitas.toFixed(2)}`;

    document.getElementById("despesasTotal")
        .innerText = `R$ ${despesas.toFixed(2)}`;

    document.getElementById("saldoTotal")
        .innerText = `R$ ${(receitas-despesas).toFixed(2)}`;

    document.getElementById("cartaoTotal")
        .innerText = `R$ ${cartao.toFixed(2)}`;

    renderizarMeses();

    renderizarCartoes();

    atualizarGraficos();
}

function renderizarMeses(){

    let div =
        document.getElementById("meses");

    div.innerHTML = "";

    for(let i = 0; i < 12; i++){

        let receitas = 0;
        let despesas = 0;

        lancamentos.forEach(l => {

            if(l.mes === i){

                if(l.natureza === "receita"){
                    receitas += l.valor;
                }else{
                    despesas += l.valor;
                }

            }

        });

        let saldo =
            receitas - despesas;

        div.innerHTML += `

            <div class="mes-card">

                <h3>${nomesMeses[i]}</h3>

                <p style="margin-top:10px;color:#22c55e;">
                    Receita: R$ ${receitas.toFixed(2)}
                </p>

                <p style="margin-top:5px;color:#ef4444;">
                    Despesa: R$ ${despesas.toFixed(2)}
                </p>

                <p style="margin-top:10px;font-size:22px;">
                    Saldo: R$ ${saldo.toFixed(2)}
                </p>

            </div>

        `;
    }

}

function renderizarCartoes(){

    let div =
        document.getElementById("cartoes");

    div.innerHTML = "<h2 style='margin-top:20px;'>Cartões</h2>";

    let cartoes = {};

    lancamentos.forEach(l => {

        if(l.cartao){

            if(!cartoes[l.cartao]){

                cartoes[l.cartao] = {
                    total:0,
                    limite:l.limite || 0
                };

            }

            cartoes[l.cartao].total += l.valor;

        }

    });

    Object.keys(cartoes).forEach(nome => {

        let usado =
            cartoes[nome].total;

        let limite =
            cartoes[nome].limite;

        let percentual =
            limite > 0
            ? (usado / limite) * 100
            : 0;

        div.innerHTML += `

            <div class="card-cartao">

                <h3>${nome}</h3>

                <p style="margin-top:10px;">
                    R$ ${usado.toFixed(2)}
                    /
                    R$ ${limite.toFixed(2)}
                </p>

                <div class="progress">

                    <div
                        class="progress-bar"
                        style="width:${percentual}%"
                    ></div>

                </div>

            </div>

        `;

    });

}

let graficoMeses;
let graficoTipos;

function atualizarGraficos(){

    let receitasMeses = [];
    let despesasMeses = [];

    for(let i = 0; i < 12; i++){

        let receitas = 0;
        let despesas = 0;

        lancamentos.forEach(l => {

            if(l.mes === i){

                if(l.natureza === "receita"){
                    receitas += l.valor;
                }else{
                    despesas += l.valor;
                }

            }

        });

        receitasMeses.push(receitas);
        despesasMeses.push(despesas);

    }

    let avista = 0;
    let parcelado = 0;
    let recorrente = 0;

    lancamentos.forEach(l => {

        if(l.tipo === "avista"){
            avista += l.valor;
        }

        if(l.tipo === "parcelado"){
            parcelado += l.valor;
        }

        if(l.tipo === "recorrente"){
            recorrente += l.valor;
        }

    });

    if(graficoMeses){
        graficoMeses.destroy();
    }

    if(graficoTipos){
        graficoTipos.destroy();
    }

    graficoMeses = new Chart(
        document.getElementById("graficoMeses"),
        {
            type:"bar",

            data:{

                labels:nomesMeses,

                datasets:[
                    {
                        label:"Receitas",
                        data:receitasMeses,
                        backgroundColor:"#22c55e"
                    },
                    {
                        label:"Despesas",
                        data:despesasMeses,
                        backgroundColor:"#ef4444"
                    }
                ]
            }
        }
    );

    graficoTipos = new Chart(
        document.getElementById("graficoTipos"),
        {
            type:"doughnut",

            data:{
                labels:[
                    "À Vista",
                    "Parcelado",
                    "Recorrente"
                ],

                datasets:[
                    {
                        data:[
                            avista,
                            parcelado,
                            recorrente
                        ],

                        backgroundColor:[
                            "#22c55e",
                            "#3b82f6",
                            "#f59e0b"
                        ]
                    }
                ]
            }
        }
    );

}

renderizar();

</script>

</body>
</html>
