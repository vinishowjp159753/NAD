<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Financeiro Pro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
    --bg:#f3f6fb;
    --card:#ffffff;
    --primary:#2563eb;
    --success:#16a34a;
    --danger:#dc2626;
    --warning:#f59e0b;
    --text:#0f172a;
    --muted:#64748b;
    --border:#e2e8f0;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter, Arial, sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    padding:20px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    flex-wrap:wrap;
    gap:15px;
}

.header h1{
    font-size:32px;
}

.subtitle{
    color:var(--muted);
    margin-top:5px;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:20px;
}

.kpi{
    background:var(--card);
    padding:22px;
    border-radius:24px;
    box-shadow:0 10px 30px rgba(0,0,0,0.04);
    border:1px solid var(--border);
}

.kpi h3{
    color:var(--muted);
    font-size:14px;
    margin-bottom:10px;
}

.kpi p{
    font-size:30px;
    font-weight:bold;
}

.green{
    color:var(--success);
}

.red{
    color:var(--danger);
}

.blue{
    color:var(--primary);
}

.orange{
    color:var(--warning);
}

.main{
    display:grid;
    grid-template-columns:350px 1fr;
    gap:20px;
}

.card{
    background:var(--card);
    border-radius:24px;
    padding:22px;
    border:1px solid var(--border);
    box-shadow:0 10px 30px rgba(0,0,0,0.04);
}

.card h2{
    margin-bottom:15px;
}

input,
select,
button{
    width:100%;
    padding:14px;
    border-radius:14px;
    border:1px solid var(--border);
    margin-top:12px;
    font-size:15px;
}

input,
select{
    background:white;
}

button{
    background:var(--primary);
    color:white;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:0.95;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.table-container{
    overflow:auto;
    margin-top:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#f8fafc;
    color:#334155;
}

th,
td{
    padding:16px;
    border-bottom:1px solid var(--border);
    text-align:left;
    white-space:nowrap;
}

.meses{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:15px;
}

.mes-card{
    background:#f8fafc;
    padding:18px;
    border-radius:18px;
}

.cartao{
    background:linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

    color:white;

    padding:18px;

    border-radius:20px;

    margin-top:15px;
}

.progress{
    width:100%;
    height:10px;
    background:rgba(255,255,255,0.2);
    border-radius:20px;
    overflow:hidden;
    margin-top:10px;
}

.progress-bar{
    height:100%;
    background:#22c55e;
}

.acoes{
    display:flex;
    gap:5px;
}

.btn-edit{
    background:#f59e0b;
}

.btn-delete{
    background:#dc2626;
}

.btn-small{
    padding:10px;
    border:none;
    border-radius:10px;
    color:white;
    cursor:pointer;
}

@media(max-width:1100px){

    .dashboard{
        grid-template-columns:1fr 1fr;
    }

    .main{
        grid-template-columns:1fr;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .meses{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:700px){

    body{
        padding:12px;
    }

    .dashboard{
        grid-template-columns:1fr;
    }

    .meses{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:24px;
    }

    .kpi p{
        font-size:24px;
    }

    table{
        font-size:13px;
    }

}

</style>

</head>

<body>

<div class="header">

    <div>

        <h1>💰 Financeiro Pro</h1>

        <p class="subtitle">
            Controle financeiro pessoal inteligente
        </p>

    </div>

</div>

<div class="dashboard">

    <div class="kpi">
        <h3>Receitas</h3>
        <p class="green" id="receitasTotal">
            R$ 0
        </p>
    </div>

    <div class="kpi">
        <h3>Despesas</h3>
        <p class="red" id="despesasTotal">
            R$ 0
        </p>
    </div>

    <div class="kpi">
        <h3>Saldo</h3>
        <p class="blue" id="saldoTotal">
            R$ 0
        </p>
    </div>

    <div class="kpi">
        <h3>Cartão</h3>
        <p class="orange" id="cartaoTotal">
            R$ 0
        </p>
    </div>

</div>

<div class="main">

<div class="card">

<h2>Novo Lançamento</h2>

<input
    type="text"
    id="descricao"
    placeholder="Descrição"
>

<input
    type="number"
    id="valor"
    placeholder="Valor"
>

<select id="natureza">

    <option value="receita">
        Receita
    </option>

    <option value="despesa">
        Despesa
    </option>

</select>

<select
    id="tipo"
    onchange="toggleCampos()"
>

    <option value="avista">
        À Vista
    </option>

    <option value="parcelado">
        Cartão Parcelado
    </option>

    <option value="recorrente">
        Recorrente
    </option>

</select>

<div id="boxCartao" style="display:none;">

    <input
        type="text"
        id="cartao"
        placeholder="Nome do cartão"
    >

    <input
        type="number"
        id="limite"
        placeholder="Limite do cartão"
    >

    <input
        type="number"
        id="parcelas"
        placeholder="Quantidade parcelas"
    >

</div>

<div id="boxRecorrencia" style="display:none;">

    <input
        type="number"
        id="recorrencia"
        placeholder="Quantidade meses"
    >

</div>

<button onclick="adicionar()">
    Adicionar
</button>

<div id="listaCartoes"></div>

</div>

<div>

<div class="grid">

<div class="card">

<h2>Fluxo Financeiro</h2>

<canvas id="graficoLinha"></canvas>

</div>

<div class="card">

<h2>Distribuição</h2>

<canvas id="graficoPizza"></canvas>

</div>

</div>

<div class="card" style="margin-top:20px;">

<h2>Resumo Mensal</h2>

<div
    class="meses"
    id="meses"
></div>

</div>

</div>

</div>

<div class="card table-container">

<h2>Lançamentos</h2>

<table>

<thead>

<tr>

<th>Descrição</th>
<th>Valor</th>
<th>Natureza</th>
<th>Tipo</th>
<th>Mês</th>
<th>Ações</th>

</tr>

</thead>

<tbody id="tabela"></tbody>

</table>

</div>

<script>

let dados =
    JSON.parse(
        localStorage.getItem("financeiro-pro")
    ) || [];

const meses = [
    "Janeiro","Fevereiro","Março","Abril",
    "Maio","Junho","Julho","Agosto",
    "Setembro","Outubro","Novembro","Dezembro"
];

function salvar(){

    localStorage.setItem(
        "financeiro-pro",
        JSON.stringify(dados)
    );

}

function toggleCampos(){

    const tipo =
        document.getElementById("tipo").value;

    document.getElementById("boxCartao")
        .style.display =
        tipo === "parcelado"
        ? "block"
        : "none";

    document.getElementById("boxRecorrencia")
        .style.display =
        tipo === "recorrente"
        ? "block"
        : "none";

}

function adicionar(){

    const descricao =
        document.getElementById("descricao").value;

    const valor =
        parseFloat(
            document.getElementById("valor").value
        );

    const natureza =
        document.getElementById("natureza").value;

    const tipo =
        document.getElementById("tipo").value;

    const cartao =
        document.getElementById("cartao").value;

    const limite =
        parseFloat(
            document.getElementById("limite").value
        ) || 0;

    const parcelas =
        parseInt(
            document.getElementById("parcelas").value
        ) || 1;

    const recorrencia =
        parseInt(
            document.getElementById("recorrencia").value
        ) || 1;

    if(!descricao || !valor){

        alert("Preencha os campos");
        return;

    }

    const hoje = new Date();

    if(tipo === "avista"){

        dados.push({

            id:Date.now(),

            descricao,

            valor,

            natureza,

            tipo,

            cartao,

            limite,

            mes:hoje.getMonth()

        });

    }

    if(tipo === "parcelado"){

        const valorParcela =
            valor / parcelas;

        for(let i = 0; i < parcelas; i++){

            let mes =
                (hoje.getMonth() + i) % 12;

            dados.push({

                id:Date.now()+i,

                descricao:
                    `${descricao} (${i+1}/${parcelas})`,

                valor:valorParcela,

                natureza,

                tipo,

                cartao,

                limite,

                mes

            });

        }

    }

    if(tipo === "recorrente"){

        for(let i = 0; i < recorrencia; i++){

            let mes =
                (hoje.getMonth() + i) % 12;

            dados.push({

                id:Date.now()+i,

                descricao,

                valor,

                natureza,

                tipo,

                mes

            });

        }

    }

    salvar();

    render();

    limpar();

}

function limpar(){

    document.getElementById("descricao").value = "";
    document.getElementById("valor").value = "";
    document.getElementById("cartao").value = "";
    document.getElementById("limite").value = "";
    document.getElementById("parcelas").value = "";
    document.getElementById("recorrencia").value = "";

}

function excluir(id){

    if(!confirm("Excluir lançamento?"))
        return;

    dados =
        dados.filter(d => d.id !== id);

    salvar();

    render();

}

function editar(id){

    const item =
        dados.find(d => d.id === id);

    if(!item) return;

    const descricao =
        prompt(
            "Descrição",
            item.descricao
        );

    const valor =
        prompt(
            "Valor",
            item.valor
        );

    if(descricao !== null)
        item.descricao = descricao;

    if(valor !== null)
        item.valor = parseFloat(valor);

    salvar();

    render();

}

function render(){

    let receitas = 0;
    let despesas = 0;
    let cartao = 0;

    const tabela =
        document.getElementById("tabela");

    tabela.innerHTML = "";

    dados.forEach(d => {

        if(d.natureza === "receita"){

            receitas += d.valor;

        }else{

            despesas += d.valor;

        }

        if(d.tipo === "parcelado"){

            cartao += d.valor;

        }

        tabela.innerHTML += `

        <tr>

        <td>${d.descricao}</td>

        <td>
            R$ ${d.valor.toFixed(2)}
        </td>

        <td>${d.natureza}</td>

        <td>${d.tipo}</td>

        <td>${meses[d.mes]}</td>

        <td>

            <div class="acoes">

                <button
                    class="btn-small btn-edit"
                    onclick="editar(${d.id})"
                >
                    Editar
                </button>

                <button
                    class="btn-small btn-delete"
                    onclick="excluir(${d.id})"
                >
                    Excluir
                </button>

            </div>

        </td>

        </tr>

        `;

    });

    document.getElementById("receitasTotal")
        .innerText =
        `R$ ${receitas.toFixed(2)}`;

    document.getElementById("despesasTotal")
        .innerText =
        `R$ ${despesas.toFixed(2)}`;

    document.getElementById("saldoTotal")
        .innerText =
        `R$ ${(receitas-despesas).toFixed(2)}`;

    document.getElementById("cartaoTotal")
        .innerText =
        `R$ ${cartao.toFixed(2)}`;

    renderMeses();

    renderCartoes();

    charts();

}

function renderMeses(){

    const div =
        document.getElementById("meses");

    div.innerHTML = "";

    for(let i = 0; i < 12; i++){

        let receitas = 0;
        let despesas = 0;

        dados.forEach(d => {

            if(d.mes === i){

                if(d.natureza === "receita"){

                    receitas += d.valor;

                }else{

                    despesas += d.valor;

                }

            }

        });

        div.innerHTML += `

        <div class="mes-card">

            <h3>${meses[i]}</h3>

            <p
                style="
                    margin-top:10px;
                    color:#16a34a;
                "
            >
                Receita:
                R$ ${receitas.toFixed(2)}
            </p>

            <p
                style="
                    margin-top:5px;
                    color:#dc2626;
                "
            >
                Despesa:
                R$ ${despesas.toFixed(2)}
            </p>

            <p
                style="
                    margin-top:10px;
                    font-size:22px;
                    font-weight:bold;
                "
            >
                Saldo:
                R$ ${(receitas-despesas).toFixed(2)}
            </p>

        </div>

        `;

    }

}

function renderCartoes(){

    const div =
        document.getElementById("listaCartoes");

    div.innerHTML = "";

    let cartoes = {};

    dados.forEach(d => {

        if(d.cartao){

            if(!cartoes[d.cartao]){

                cartoes[d.cartao] = {

                    total:0,

                    limite:d.limite || 0

                };

            }

            cartoes[d.cartao].total += d.valor;

        }

    });

    Object.keys(cartoes).forEach(nome => {

        const usado =
            cartoes[nome].total;

        const limite =
            cartoes[nome].limite;

        const percentual =
            limite > 0
            ? (usado/limite)*100
            : 0;

        div.innerHTML += `

        <div class="cartao">

            <h3>${nome}</h3>

            <p style="margin-top:10px;">

                R$ ${usado.toFixed(2)}

                /

                R$ ${limite.toFixed(2)}

            </p>

            <div class="progress">

                <div
                    class="progress-bar"
                    style="width:${percentual}%"
                ></div>

            </div>

        </div>

        `;

    });

}

let chart1;
let chart2;

function charts(){

    const receitasMes = [];
    const despesasMes = [];

    for(let i = 0; i < 12; i++){

        let r = 0;
        let d = 0;

        dados.forEach(item => {

            if(item.mes === i){

                if(item.natureza === "receita"){

                    r += item.valor;

                }else{

                    d += item.valor;

                }

            }

        });

        receitasMes.push(r);
        despesasMes.push(d);

    }

    let avista = 0;
    let parcelado = 0;
    let recorrente = 0;

    dados.forEach(d => {

        if(d.tipo === "avista")
            avista += d.valor;

        if(d.tipo === "parcelado")
            parcelado += d.valor;

        if(d.tipo === "recorrente")
            recorrente += d.valor;

    });

    if(chart1) chart1.destroy();
    if(chart2) chart2.destroy();

    chart1 = new Chart(

        document.getElementById("graficoLinha"),

        {

            type:"line",

            data:{

                labels:meses,

                datasets:[

                    {

                        label:"Receitas",

                        data:receitasMes,

                        borderColor:"#16a34a",

                        backgroundColor:"#16a34a"

                    },

                    {

                        label:"Despesas",

                        data:despesasMes,

                        borderColor:"#dc2626",

                        backgroundColor:"#dc2626"

                    }

                ]

            }

        }

    );

    chart2 = new Chart(

        document.getElementById("graficoPizza"),

        {

            type:"doughnut",

            data:{

                labels:[
                    "À Vista",
                    "Parcelado",
                    "Recorrente"
                ],

                datasets:[

                    {

                        data:[
                            avista,
                            parcelado,
                            recorrente
                        ],

                        backgroundColor:[

                            "#2563eb",
                            "#f59e0b",
                            "#16a34a"

                        ]

                    }

                ]

            }

        }

    );

}

render();

</script>

</body>

</html>
