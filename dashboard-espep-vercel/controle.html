<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Financeiro Pro Firebase</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
    --bg:#f4f7fb;
    --card:#ffffff;
    --primary:#2563eb;
    --success:#16a34a;
    --danger:#dc2626;
    --warning:#f59e0b;
    --text:#0f172a;
    --muted:#64748b;
    --border:#e2e8f0;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter, Arial;
}

body{
    background:var(--bg);
    color:var(--text);
    padding:15px;
}

.header{
    margin-bottom:20px;
}

.header h1{
    font-size:32px;
}

.subtitle{
    color:var(--muted);
    margin-top:5px;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.kpi{
    background:var(--card);
    padding:20px;
    border-radius:20px;
    border:1px solid var(--border);
}

.kpi h3{
    font-size:14px;
    color:var(--muted);
}

.kpi p{
    margin-top:10px;
    font-size:28px;
    font-weight:bold;
}

.green{color:var(--success);}
.red{color:var(--danger);}
.blue{color:var(--primary);}
.orange{color:var(--warning);}

.main{
    display:grid;
    grid-template-columns:360px 1fr;
    gap:20px;
}

.card{
    background:var(--card);
    padding:20px;
    border-radius:20px;
    border:1px solid var(--border);
}

.card h2{
    margin-bottom:15px;
}

input,
select,
button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border-radius:12px;
    border:1px solid var(--border);
}

button{
    background:var(--primary);
    color:white;
    border:none;
    font-weight:bold;
    cursor:pointer;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.table-container{
    margin-top:20px;
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#f8fafc;
}

th,
td{
    padding:14px;
    border-bottom:1px solid var(--border);
}

.meses{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.mes-card{
    background:#f8fafc;
    padding:15px;
    border-radius:15px;
}

.resumo-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.resumo-card{
    background:#f8fafc;
    padding:20px;
    border-radius:20px;
}

.resumo-item{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    border-bottom:1px solid #ddd;
    padding-bottom:8px;
}

.cartao{
    background:linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

    color:white;
    padding:18px;
    border-radius:20px;
    margin-top:15px;
}

.progress{
    width:100%;
    height:10px;
    background:rgba(255,255,255,0.2);
    border-radius:20px;
    overflow:hidden;
    margin-top:10px;
}

.progress-bar{
    height:100%;
    background:#22c55e;
}

.acoes{
    display:flex;
    gap:5px;
}

.btn-small{
    padding:10px;
    border:none;
    border-radius:10px;
    color:white;
    cursor:pointer;
}

.btn-edit{
    background:#f59e0b;
}

.btn-delete{
    background:#dc2626;
}

@media(max-width:1100px){

    .dashboard{
        grid-template-columns:1fr 1fr;
    }

    .main{
        grid-template-columns:1fr;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .meses{
        grid-template-columns:1fr 1fr;
    }

    .resumo-box{
        grid-template-columns:1fr;
    }

}

@media(max-width:700px){

    body{
        padding:10px;
    }

    .dashboard{
        grid-template-columns:1fr;
    }

    .meses{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:24px;
    }

}

</style>

</head>

<body>

<div class="header">

<h1>💰 Financeiro Pro</h1>

<p class="subtitle">
Sistema financeiro sincronizado com Firebase
</p>

</div>

<div class="dashboard">

<div class="kpi">
<h3>Receitas</h3>
<p class="green" id="receitasTotal">R$ 0</p>
</div>

<div class="kpi">
<h3>Despesas</h3>
<p class="red" id="despesasTotal">R$ 0</p>
</div>

<div class="kpi">
<h3>Saldo</h3>
<p class="blue" id="saldoTotal">R$ 0</p>
</div>

<div class="kpi">
<h3>Cartão</h3>
<p class="orange" id="cartaoTotal">R$ 0</p>
</div>

</div>

<div class="main">

<div class="card">

<h2>Novo Lançamento</h2>

<input type="text" id="descricao" placeholder="Descrição">

<input type="number" id="valor" placeholder="Valor">

<select id="natureza">

<option value="receita">Receita</option>
<option value="despesa">Despesa</option>

</select>

<select id="tipo" onchange="toggleCampos()">

<option value="avista">À Vista</option>
<option value="parcelado">Cartão Parcelado</option>
<option value="recorrente">Recorrente</option>

</select>

<div id="boxData">

<select id="mes">

<option value="0">Janeiro</option>
<option value="1">Fevereiro</option>
<option value="2">Março</option>
<option value="3">Abril</option>
<option value="4">Maio</option>
<option value="5">Junho</option>
<option value="6">Julho</option>
<option value="7">Agosto</option>
<option value="8">Setembro</option>
<option value="9">Outubro</option>
<option value="10">Novembro</option>
<option value="11">Dezembro</option>

</select>

<input
type="number"
id="ano"
value="2026"
placeholder="Ano"
>

</div>

<div id="boxCartao" style="display:none;">

<input
type="text"
id="cartao"
placeholder="Nome do cartão"
>

<input
type="number"
id="limite"
placeholder="Limite do cartão"
>

<input
type="number"
id="parcelas"
placeholder="Quantidade parcelas"
>

</div>

<div id="boxRecorrencia" style="display:none;">

<input
type="number"
id="recorrencia"
placeholder="Qtd meses"
>

</div>

<button onclick="adicionar()">
Adicionar
</button>

<div id="listaCartoes"></div>

</div>

<div>

<div class="grid">

<div class="card">

<h2>Fluxo Financeiro</h2>

<canvas id="graficoLinha"></canvas>

</div>

<div class="card">

<h2>Distribuição</h2>

<canvas id="graficoPizza"></canvas>

</div>

</div>

<div class="card" style="margin-top:20px;">

<h2>Resumo Mensal</h2>

<div class="meses" id="mesesResumo"></div>

</div>

<div class="card" style="margin-top:20px;">

<h2>Resumo Geral</h2>

<div class="resumo-box">

<div class="resumo-card">

<h3>Receitas</h3>

<div id="listaReceitas"></div>

</div>

<div class="resumo-card">

<h3>Despesas</h3>

<div id="listaDespesas"></div>

</div>

</div>

</div>

</div>

</div>

<div class="card table-container">

<h2>Lançamentos</h2>

<table>

<thead>

<tr>

<th>Descrição</th>
<th>Valor</th>
<th>Natureza</th>
<th>Tipo</th>
<th>Mês</th>
<th>Ano</th>
<th>Ações</th>

</tr>

</thead>

<tbody id="tabela"></tbody>

</table>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    updateDoc

}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyD8bYo0O_yRhv8x3GFiG4Y7D_a1jzlnigQ",

  authDomain: "controle-99a55.firebaseapp.com",

  projectId: "controle-99a55",

  storageBucket: "controle-99a55.firebasestorage.app",

  messagingSenderId: "402728826885",

  appId: "1:402728826885:web:9469255944e2ba2436846c",

  measurementId: "G-PNPXVV7DQQ"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

let dados = [];

const meses = [

"Janeiro","Fevereiro","Março","Abril",
"Maio","Junho","Julho","Agosto",
"Setembro","Outubro","Novembro","Dezembro"

];

window.toggleCampos = function(){

const tipo =
document.getElementById("tipo").value;

document.getElementById("boxCartao")
.style.display =
tipo === "parcelado"
? "block"
: "none";

document.getElementById("boxRecorrencia")
.style.display =
tipo === "recorrente"
? "block"
: "none";

document.getElementById("boxData")
.style.display =
tipo === "recorrente"
? "none"
: "block";

}

window.adicionar = async function(){

const descricao =
document.getElementById("descricao").value;

const valor =
parseFloat(
document.getElementById("valor").value
);

const natureza =
document.getElementById("natureza").value;

const tipo =
document.getElementById("tipo").value;

const cartao =
document.getElementById("cartao").value;

const limite =
parseFloat(
document.getElementById("limite").value
) || 0;

const parcelas =
parseInt(
document.getElementById("parcelas").value
) || 1;

const recorrencia =
parseInt(
document.getElementById("recorrencia").value
) || 1;

let mesBase;
let anoBase;

const hoje = new Date();

if(tipo === "recorrente"){

mesBase = hoje.getMonth();

anoBase = hoje.getFullYear();

}else{

mesBase =
parseInt(
document.getElementById("mes").value
);

anoBase =
parseInt(
document.getElementById("ano").value
);

}

if(tipo === "avista"){

await addDoc(

collection(db,"lancamentos"),

{

descricao,
valor,
natureza,
tipo,
mes:mesBase,
ano:anoBase,
cartao,
limite

}

);

}

if(tipo === "parcelado"){

const valorParcela =
valor / parcelas;

for(let i = 0; i < parcelas; i++){

let mes =
(mesBase + i) % 12;

let ano =
anoBase +
Math.floor((mesBase + i) / 12);

await addDoc(

collection(db,"lancamentos"),

{

descricao:
`${descricao} (${i+1}/${parcelas})`,

valor:valorParcela,

natureza,

tipo,

mes,

ano,

cartao,

limite

}

);

}

}

if(tipo === "recorrente"){

for(let i = 0; i < recorrencia; i++){

let mes =
(mesBase + i) % 12;

let ano =
anoBase +
Math.floor((mesBase + i) / 12);

await addDoc(

collection(db,"lancamentos"),

{

descricao,
valor,
natureza,
tipo,
mes,
ano

}

);

}

}

carregarDados();

limpar();

}

function limpar(){

document.getElementById("descricao").value="";
document.getElementById("valor").value="";
document.getElementById("cartao").value="";
document.getElementById("limite").value="";
document.getElementById("parcelas").value="";
document.getElementById("recorrencia").value="";

}

window.excluir = async function(id){

await deleteDoc(
doc(db,"lancamentos",id)
);

carregarDados();

}

window.editar = async function(id){

const item =
dados.find(d => d.id === id);

const descricao =
prompt(
"Descrição",
item.descricao
);

const valor =
prompt(
"Valor",
item.valor
);

if(descricao !== null){

await updateDoc(

doc(db,"lancamentos",id),

{

descricao,
valor:parseFloat(valor)

}

);

}

carregarDados();

}

async function carregarDados(){

dados = [];

const querySnapshot =
await getDocs(
collection(db,"lancamentos")
);

querySnapshot.forEach(docSnap => {

dados.push({

id:docSnap.id,

...docSnap.data()

});

});

render();

}

function render(){

const tabela =
document.getElementById("tabela");

tabela.innerHTML = "";

let receitas = 0;
let despesas = 0;
let cartao = 0;

const receitasResumo = {};
const despesasResumo = {};

dados.forEach(d => {

if(d.natureza === "receita"){

receitas += d.valor;

if(!receitasResumo[d.descricao])
receitasResumo[d.descricao] = 0;

receitasResumo[d.descricao] += d.valor;

}else{

despesas += d.valor;

if(!despesasResumo[d.descricao])
despesasResumo[d.descricao] = 0;

despesasResumo[d.descricao] += d.valor;

}

if(d.tipo === "parcelado"){
cartao += d.valor;
}

tabela.innerHTML += `

<tr>

<td>${d.descricao}</td>

<td>R$ ${d.valor.toFixed(2)}</td>

<td>${d.natureza}</td>

<td>${d.tipo}</td>

<td>${meses[d.mes]}</td>

<td>${d.ano}</td>

<td>

<div class="acoes">

<button
class="btn-small btn-edit"
onclick="editar('${d.id}')"
>

Editar

</button>

<button
class="btn-small btn-delete"
onclick="excluir('${d.id}')"
>

Excluir

</button>

</div>

</td>

</tr>

`;

});

document.getElementById("receitasTotal")
.innerText =
`R$ ${receitas.toFixed(2)}`;

document.getElementById("despesasTotal")
.innerText =
`R$ ${despesas.toFixed(2)}`;

document.getElementById("saldoTotal")
.innerText =
`R$ ${(receitas-despesas).toFixed(2)}`;

document.getElementById("cartaoTotal")
.innerText =
`R$ ${cartao.toFixed(2)}`;

renderMeses();

renderResumo(
receitasResumo,
despesasResumo
);

renderCartoes();

graficos();

}

function renderResumo(
receitasResumo,
despesasResumo
){

const receitasDiv =
document.getElementById("listaReceitas");

const despesasDiv =
document.getElementById("listaDespesas");

receitasDiv.innerHTML = "";
despesasDiv.innerHTML = "";

Object.keys(receitasResumo)
.forEach(nome => {

receitasDiv.innerHTML += `

<div class="resumo-item">

<span>${nome}</span>

<strong class="green">

R$ ${receitasResumo[nome].toFixed(2)}

</strong>

</div>

`;

});

Object.keys(despesasResumo)
.forEach(nome => {

despesasDiv.innerHTML += `

<div class="resumo-item">

<span>${nome}</span>

<strong class="red">

R$ ${despesasResumo[nome].toFixed(2)}

</strong>

</div>

`;

});

}

function renderMeses(){

const div =
document.getElementById("mesesResumo");

div.innerHTML = "";

for(let i = 0; i < 12; i++){

let receitas = 0;
let despesas = 0;

dados.forEach(d => {

if(d.mes === i){

if(d.natureza === "receita"){

receitas += d.valor;

}else{

despesas += d.valor;

}

}

});

div.innerHTML += `

<div class="mes-card">

<h3>${meses[i]}</h3>

<p style="margin-top:10px;color:#16a34a;">

Receita:
R$ ${receitas.toFixed(2)}

</p>

<p style="margin-top:5px;color:#dc2626;">

Despesa:
R$ ${despesas.toFixed(2)}

</p>

<p
style="
margin-top:10px;
font-size:22px;
font-weight:bold;
"
>

Saldo:
R$ ${(receitas-despesas).toFixed(2)}

</p>

</div>

`;

}

}

function renderCartoes(){

const div =
document.getElementById("listaCartoes");

div.innerHTML = "";

let cartoes = {};

dados.forEach(d => {

if(d.cartao){

if(!cartoes[d.cartao]){

cartoes[d.cartao] = {

total:0,
limite:d.limite || 0

};

}

cartoes[d.cartao].total += d.valor;

}

});

Object.keys(cartoes)
.forEach(nome => {

const usado =
cartoes[nome].total;

const limite =
cartoes[nome].limite;

const percentual =
limite > 0
? (usado/limite)*100
: 0;

div.innerHTML += `

<div class="cartao">

<h3>${nome}</h3>

<p style="margin-top:10px;">

R$ ${usado.toFixed(2)}

/

R$ ${limite.toFixed(2)}

</p>

<div class="progress">

<div
class="progress-bar"
style="width:${percentual}%"
></div>

</div>

</div>

`;

});

}

let chart1;
let chart2;

function graficos(){

const receitasMes = [];
const despesasMes = [];

for(let i = 0; i < 12; i++){

let r = 0;
let d = 0;

dados.forEach(item => {

if(item.mes === i){

if(item.natureza === "receita"){

r += item.valor;

}else{

d += item.valor;

}

}

});

receitasMes.push(r);
despesasMes.push(d);

}

if(chart1) chart1.destroy();
if(chart2) chart2.destroy();

chart1 = new Chart(

document.getElementById("graficoLinha"),

{

type:"line",

data:{

labels:meses,

datasets:[

{

label:"Receitas",

data:receitasMes,

borderColor:"#16a34a"

},

{

label:"Despesas",

data:despesasMes,

borderColor:"#dc2626"

}

]

}

}

);

chart2 = new Chart(

document.getElementById("graficoPizza"),

{

type:"doughnut",

data:{

labels:[
"Receitas",
"Despesas"
],

datasets:[

{

data:[

receitasMes.reduce((a,b)=>a+b,0),

despesasMes.reduce((a,b)=>a+b,0)

],

backgroundColor:[
"#16a34a",
"#dc2626"
]

}

]

}

}

);

}

carregarDados();

</script>

</body>

</html>
